- defaults:
    link:
        relink: true

- link:
    # every folder in dot_config, symlink those folder to .config
    # This is universal
    ~/.config/:
        glob: true
        path: dot_config/**

    # Every file in home is prefix with ".", so this is fine
    ~/:
        glob: true
        path: home/.*

    # Other Things
    ~/.my-emacs.d:
        path: other/emacs

  # ~/Library/Rime:
  #   glob: true
  #   path: Rime/*
  #   if: '[ "$(uname -s)" = "Darwin" ]'
    ~/.local/share/fcitx5/rime:
      glob: true
      path: other/rime/*
      if: '[ "$(uname -s)" = "Linux" ]'

# Mac Only
- link:
    ~/:
        glob: true
        path: home_mac/.*
        if: '[ "$(uname -s)" = "Darwin" ]'

# Linux Only
- link:
    ~/.config/:
        glob: true
        path: dot_config_linux/**
        if: '[ "$(uname -s)" = "Linux" ]'
