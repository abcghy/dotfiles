- defaults:
    link:
        relink: true

- link:
    # every folder in dot_config, symlink those folder to .config
    # This is universal
    ~/.config/:
        glob: true
        path: dot_config/**

    # Every file in home is prefix with ".", so this is fine
    ~/:
        glob: true
        path: home/.*

    # Claude Code user settings — single file only.
    # Do NOT link the whole ~/.claude dir: it holds runtime state
    # (history, sessions, telemetry). Same config on macOS and Linux.
    ~/.claude/settings.json:
        create: true
        path: claude/settings.json

    # Other Things
    ~/.my-emacs.d:
        path: other/emacs

  # ~/Library/Rime:
  #   glob: true
  #   path: Rime/*
  #   if: '[ "$(uname -s)" = "Darwin" ]'
    ~/.local/share/fcitx5/rime:
      glob: true
      path: other/rime/*
      if: '[ "$(uname -s)" = "Linux" ]'

# Mac Only
- link:
    ~/:
        glob: true
        path: home_mac/.*
        if: '[ "$(uname -s)" = "Darwin" ]'

# Linux Only
- link:
    ~/.config/:
        glob: true
        path: dot_config_linux/**
        if: '[ "$(uname -s)" = "Linux" ]'

# Bootstrap deps (idempotent — never fails the install)
- shell:
  - command: >-
      command -v ccusage >/dev/null 2>&1 || { command -v npm >/dev/null 2>&1 && npm install -g ccusage || echo "[ccusage] skipped: npm not found"; }
    description: Ensure ccusage is installed (Claude Code statusline)
    stdout: true
    stderr: true
