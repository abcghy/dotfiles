<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Default fonts for different families -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>  <!-- Chinese (Simplified) -->
    </prefer>
  </alias>
  
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>  <!-- Chinese (Simplified) -->
    </prefer>
  </alias>
  
  <alias>
    <family>monospace</family>
    <prefer>
      <!-- <family>DejaVu Sans Mono</family> -->
      <family>Maple Mono NF CN</family>
      <family>Sarasa Term SC Nerd</family>
      <family>Noto Sans Mono CJK SC</family>  <!-- Chinese (Simplified) -->
    </prefer>
  </alias>

  <!-- Basic font rendering settings -->
  <match target="font">
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hinting">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <edit mode="assign" name="rgba">
      <const>rgb</const>
    </edit>
    <edit mode="assign" name="lcdfilter">
      <const>lcddefault</const>
    </edit>
  </match>
</fontconfig>
